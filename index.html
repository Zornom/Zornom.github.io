<!DOCTYPE html>
<html lang="en">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
<head>
    <meta name="viewport" content="user-scalable=0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="Bilderliste.js"></script>
    <script src="index.js"></script>
    <script src="common.js"></script>
    <link href="font-awesome.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Bilderliste</title>
    <style>
        :root {
            --teamcolor: #7990ec;
            --bg-color: #ffffff;
            --text-color: #000000;
            --canvas-bg: #f5f5f5;
            --grid-color: #000000;
            --grid-thin: #cccccc;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #eeeeee;
            --canvas-bg: #16213e;
            --grid-color: #ffffff;
            --grid-thin: #4a4a6a;
        }

        [data-theme="solarized-dark"] {
            --bg-color: #002b36;
            --text-color: #839496;
            --canvas-bg: #073642;
            --grid-color: #586e75;
            --grid-thin: #657b83;
        }

        [data-theme="solarized-light"] {
            --bg-color: #fdf6e3;
            --text-color: #93a1a1;
            --canvas-bg: #eee8d5;
            --grid-color: #657b83;
            --grid-thin: #cb4b16;
        }

        body {
            margin: 0;

            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s;

            display: flex;
            flex-direction: column;
            align-items: center;

            min-height: 100vh;  /* Fallback für ältere Browser */
            min-height: 100dvh; /* damit Adressbar am Handy nichts überdeckt. */
        }

        .btn {
            background-color: var(--teamcolor);
            border: none;
            color: white;
            padding: 8px 14px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        h1, h2 {
            margin: 5px 0;
        }

        td.l, td.r, .sb{
            width: 2em;
            height: 2em;
            padding: 5px;
        }

        td.c{
            width: auto;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        #halle {
            background-color: var(--canvas-bg);
            border: 2px solid var(--teamcolor);
            border-radius: 8px;
            margin: 20px auto;
            display: block;

            width: 100%;
            aspect-ratio: 1;
        }

        /* Autoplay status indicator */
        .autoplay-status {
            position: fixed;
            bottom: 40px;
            right: 20px;
            background-color: var(--teamcolor);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 99;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .autoplay-status.active {
            display: block;
        }

        /* Autoplay controls at bottom */
        .autoplay-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            align-items: center;
            z-index: 98;
        }

        @media (min-width: 768px) {
            .autoplay-controls {
                display: flex;
            }
        }

        /* Theme button - fixed at bottom right */
        #bottom-bar > * {
            background-color: var(--teamcolor);
            color: white;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.95em;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: opacity 0.2s;
            user-select: none;
        }

        #bottom-bar > :first-child {
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }

        #bottom-bar > :last-child {
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #bottom-bar > :hover {
            opacity: 0.9;
        }

        #bottom-bar {
            align-self: flex-end;
            margin: 20px;

            display: flex;
            flex-direction: row;
        }

        #bildname {
            font-weight: bold;
        }

        #content {
            display: flex;
            flex-direction: column;
            margin: 20px;
            width: 100%; /* be as wide as possible */
            max-width: min(90vw, 70vh, 60rem); /* but not too wide */
        }

        @media only screen and (max-width: 992px) { /* Tablets, Handys: Knöpfe unten für angenehmere Bedienbarkeit */
            #content {
                flex-direction: column-reverse;
            }
        }

        /* Coordinate table below the floor */
        #coord-panel {
            margin-bottom: 20px;
            font-variant-numeric: tabular-nums;
        }

        .coord-hint {
            font-size: 0.85em;
            opacity: 0.7;
            text-align: center;
        }

        .coord-table {
            border: 2px solid var(--teamcolor);
            background-color: var(--canvas-bg);
            table-layout: fixed; /* equal column widths */
        }

        /* Only one position shown: compact table, centered */
        .coord-table.single {
            width: auto;
            min-width: 12rem;
            margin: 0 auto;
        }

        .coord-table th,
        .coord-table td {
            padding: 4px 6px;
            text-align: center;
            border: 1px solid var(--grid-thin);
        }

        .coord-table thead th {
            background-color: var(--teamcolor);
            color: white;
        }

        /* Row labels (Position, x, y) */
        .coord-table th[scope="row"] {
            text-align: left;
            white-space: nowrap;
            width: 5.5em;
        }

        /* Row labels for separated men (blue) / women (red) */
        .coord-table tr.men th[scope="row"] {
            background-color: var(--teamcolor);
            color: white;
        }

        .coord-table tr.women th[scope="row"] {
            background-color: #e0525a;
            color: white;
        }

        .coord-table .highlighted {
            background-color: #ff8c00;
            color: white;
            font-weight: bold;
        }

        .coord-table thead th.highlighted {
            background-color: #ff8c00;
        }


        .flex-grow {
            flex-grow: 1;
        }

        .flex-center {
            display: flex;
            align-items: center;
        }

    </style>
</head>
<body>
    <div id="content">
        <table>
            <tr>
                <td class="l"><button onclick="prevdrittel()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
                <td class="c"><div id="drittel"></div> </td>
                <td class="r"><button onclick="nextdrittel()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
            </tr>
            <tr>
                <td class="l"><button onclick="prevtanz()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
                <td class="c"><div id="tanz"></div>    </td>
                <td class="r"><button onclick="nexttanz()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
            </tr>
            <tr>
                <td class="l"><button onclick="prev()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
                <td class="c"><div id="bildname"></div></td>
                <td class="r"><button onclick="next()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
            </tr>
        </table>

        <div id="canvas-div">
            <canvas id="halle" width="1000" height="1000"></canvas>
            <div id="coord-panel"></div>
        </div>
    </div>

    <div id="dbg"></div>

    <div class="flex-grow"></div>


    <!-- Autoplay controls at bottom     <div class="autoplay-controls">
        <button onclick="startAutoplay()" class="btn"><i class="fa fa-play"></i></button>
        <button onclick="stopAutoplay()" class="btn"><i class="fa fa-stop"></i></button>
    </div>
-->

    <!-- Theme button - fixed at bottom right -->

    <div id="bottom-bar">
        <button onclick="toggleThemeDropdown()" id="theme-button">
            <i class="fa fa-palette"></i> Theme: <span id="current-theme">Light</span>
        </button>
        <div class="flex-center">
            <input type="checkbox"
                   name="invert-positions"
                   id="invert-positions">
            <label for="invert-positions">Invertieren</label>
        </div>
        <div class="flex-center">
            <label for="highlight-position">Position:&nbsp;</label>
            <select name="highlight-position" id="highlight-position">
                <option value="">–</option>
            </select>
        </div>
        <div class="flex-center">
            <input type="checkbox"
                   name="show-all-coords"
                   id="show-all-coords">
            <label for="show-all-coords">Alle Koordinaten</label>
        </div>
    </div>

    <!-- Theme dropdown -->
    <div id="theme-dropdown-content" style="display:none; position:fixed; top:auto; bottom:100px; right:60px; background:white; border:1px solid #ccc; padding:10px; border-radius:4px; z-index:101;">
        <button onclick="setTheme('light')">Light</button><br><br>
        <button onclick="setTheme('dark')">Dark</button><br><br>
        <button onclick="setTheme('solarized-dark')">Solarized Dark</button><br><br>
        <button onclick="setTheme('solarized-light')">Solarized Light</button>
    </div>

    <!-- Autoplay status indicator -->
    <div class="autoplay-status" id="autoplay-status">
        <i class="fa fa-spinner fa-spin"></i> Autoplay Active
    </div>

    <script>
        // Theme toggle function
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            const themeNames = {
                'light': 'Light',
                'dark': 'Dark',
                'solarized-dark': 'Solarized Dark',
                'solarized-light': 'Solarized Light'
            };
            document.getElementById('current-theme').innerText = themeNames[theme] || theme;
            localStorage.setItem('theme', theme);
        }

        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        // Keyboard shortcuts for theme switching (Ctrl+D/S/L)
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey) {
                if (e.key === 'd') {
                    setTheme('dark');
                } else if (e.key === 's') {
                    setTheme('solarized-dark');
                } else if (e.key === 'l') {
                    setTheme('light');
                }
            }
        });

        // Theme dropdown toggle
        function toggleThemeDropdown() {
            const content = document.getElementById('theme-dropdown-content');
            const isVisible = content.style.display === 'block';
            content.style.display = isVisible ? 'none' : 'block';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdownContent = document.getElementById('theme-dropdown-content');
            const themeButton = document.getElementById('theme-button');
            if (!dropdownContent.contains(e.target) && !themeButton.contains(e.target)) {
                dropdownContent.style.display = 'none';
            }
        });

        let invertElem = document.getElementById("invert-positions");
        setInvertPositions(invertElem.checked);
        invertElem.onchange = (event) => {
            setInvertPositions(event.target.checked);
            refresh();
        }

        // Dropdown to highlight one position number in all pictures
        let highlightElem = document.getElementById("highlight-position");
        for (let i = 1; i <= numPositions; i++) {
            const option = document.createElement("option");
            option.value = i;
            option.innerText = i;
            highlightElem.appendChild(option);
        }
        highlightElem.onchange = (event) => {
            const value = event.target.value;
            setHighlightedPosition(value === "" ? null : Number(value));
            if (scale > 0) drawBoard(); // redraw only once the canvas is set up
        }

        // Toggle to list the coordinates of all positions next to the floor
        let showAllElem = document.getElementById("show-all-coords");
        setShowAllCoords(showAllElem.checked);
        showAllElem.onchange = (event) => {
            setShowAllCoords(event.target.checked);
            if (scale > 0) drawBoard();
        }
    </script>
</body>
</html>
