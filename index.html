<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="user-scalable=0">

    <script src="Bilderliste Letztes Drittel.js"></script>
    <script src="index.js"></script>
    <script src="common.js"></script>
    <link href="font-awesome.css" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Bilderliste</title>
    <style>
        :root {
            --teamcolor: #7990ec;
            --bg-color: #ffffff;
            --text-color: #000000;
            --canvas-bg: #f5f5f5;
            --grid-color: #000000;
            --grid-thin: #cccccc;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #eeeeee;
            --canvas-bg: #16213e;
            --grid-color: #ffffff;
            --grid-thin: #4a4a6a;
        }

        [data-theme="solarized-dark"] {
            --bg-color: #002b36;
            --text-color: #839496;
            --canvas-bg: #073642;
            --grid-color: #586e75;
            --grid-thin: #657b83;
        }

        [data-theme="solarized-light"] {
            --bg-color: #fdf6e3;
            --text-color: #93a1a1;
            --canvas-bg: #eee8d5;
            --grid-color: #657b83;
            --grid-thin: #cb4b16;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s;
        }

        .btn {
            background-color: var(--teamcolor);
            border: none;
            color: white;
            padding: 8px 14px;
            font-size: 1.2em;
            cursor: pointer;
            border-radius: 6px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        h1, h2 {
            margin: 5px 0;
        }

        td.l, td.r, .sb{
            width: 2em;
            height: 2em;
            padding: 5px;
        }

        td.c{
            width: auto;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        #halle {
            background-color: var(--canvas-bg);
            border: 2px solid var(--teamcolor);
            border-radius: 8px;
            margin: 20px auto;
            display: block;
        }

        /* Autoplay status indicator */
        .autoplay-status {
            position: fixed;
            bottom: 40px;
            right: 20px;
            background-color: var(--teamcolor);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            z-index: 99;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .autoplay-status.active {
            display: block;
        }

        /* Autoplay controls at bottom */
        .autoplay-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            align-items: center;
            z-index: 98;
        }

        @media (min-width: 768px) {
            .autoplay-controls {
                display: flex;
            }
        }

        /* Theme button - fixed at bottom right */
        #theme-button {
            position: fixed;
            bottom: 40px;
            right: 20px;
            background-color: var(--teamcolor);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: opacity 0.2s;
        }

        #theme-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="l"><button onclick="prevdrittel()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
            <td class="c"><h2 id="drittel"></h2> </td>
            <td class="r"><button onclick="nextdrittel()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
        </tr>
        <tr>
            <td class="l"><button onclick="prevtanz()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
            <td class="c"><h2 id="tanz"></h2>    </td>
            <td class="r"><button onclick="nexttanz()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
        </tr>
        <tr>
            <td class="l"><button onclick="prev()" class="btn"><i class="fa fa-arrow-left"></i></button></td>
            <td class="c"><h1 id="bildname"></h1></td>
            <td class="r"><button onclick="next()" class="btn"><i class="fa fa-arrow-right"></i></button></td>
        </tr>
    </table>

    <div style="margin-top: 20px;">
        <canvas id="halle"></canvas>
    </div>

    <!-- Autoplay controls at bottom -->
    <div class="autoplay-controls">
        <button onclick="startAutoplay()" class="btn"><i class="fa fa-play"></i></button>
        <button onclick="stopAutoplay()" class="btn"><i class="fa fa-stop"></i></button>
    </div>

    <!-- Theme button - fixed at bottom right -->
    <button onclick="toggleThemeDropdown()" id="theme-button">
        <i class="fa fa-palette"></i> Theme: <span id="current-theme">Light</span>
    </button>

    <!-- Theme dropdown -->
    <div id="theme-dropdown-content" style="display:none; position:fixed; top:auto; bottom:100px; right:60px; background:white; border:1px solid #ccc; padding:10px; border-radius:4px; z-index:101;">
        <button onclick="setTheme('light')">Light</button><br><br>
        <button onclick="setTheme('dark')">Dark</button><br><br>
        <button onclick="setTheme('solarized-dark')">Solarized Dark</button><br><br>
        <button onclick="setTheme('solarized-light')">Solarized Light</button>
    </div>

    <!-- Autoplay status indicator -->
    <div class="autoplay-status" id="autoplay-status">
        <i class="fa fa-spinner fa-spin"></i> Autoplay Active
    </div>

    <script>
        // Theme toggle function
        function setTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            const themeNames = {
                'light': 'Light',
                'dark': 'Dark',
                'solarized-dark': 'Solarized Dark',
                'solarized-light': 'Solarized Light'
            };
            document.getElementById('current-theme').innerText = themeNames[theme] || theme;
            localStorage.setItem('theme', theme);
        }

        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        // Keyboard shortcuts for theme switching (Ctrl+D/S/L)
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey) {
                if (e.key === 'd') {
                    setTheme('dark');
                } else if (e.key === 's') {
                    setTheme('solarized-dark');
                } else if (e.key === 'l') {
                    setTheme('light');
                }
            }
        });

        // Theme dropdown toggle
        function toggleThemeDropdown() {
            const content = document.getElementById('theme-dropdown-content');
            const isVisible = content.style.display === 'block';
            content.style.display = isVisible ? 'none' : 'block';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdownContent = document.getElementById('theme-dropdown-content');
            const themeButton = document.getElementById('theme-button');
            if (!dropdownContent.contains(e.target) && !themeButton.contains(e.target)) {
                dropdownContent.style.display = 'none';
            }
        });
    </script>
</body>
</html>
